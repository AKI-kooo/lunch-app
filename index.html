<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>10min LUNCH</title>
  <meta name="theme-color" content="#8c6d53" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg?v=2" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --text: #2c2a29;
      --muted: #6e6a66;
      --border: #e5e1da;
      --accent: #8c6d53;
      --accent-dark: #6f543e;
      --card-ok-bg: #e7f3ec;
      --card-ok-text: #1f6b43;
      --paypay-bg: #fde8ec;
      --paypay-text: #c2183a;
      --cash-only-bg: #fef0e6;
      --cash-only-text: #b84225;
      --memo-bg: #faf6eb;
      --memo-border: #eadcb8;
      --star-active: #e09f1f;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 48px;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em; }
    .add-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    main { max-width: 720px; margin: 0 auto; padding: 14px 16px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 14px;
    }

    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 11px; }
    .field { flex: 1; min-width: 135px; }
    .field label {
      display: block;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .field input[type="text"],
    .field input[type="url"],
    .field input[type="time"],
    .field input[type="number"],
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.94rem;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }

    .inline-wrap { display: flex; gap: 6px; }
    .sub-pill-btn {
      white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      padding: 0 11px;
      font-size: 0.83rem;
      cursor: pointer;
    }
    .sub-pill-btn.gps-active {
      background: #e8f0fe;
      border-color: #90b8f8;
      color: #1967d2;
      font-weight: 700;
    }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .chip.active { background: var(--text); color: #fff; border-color: var(--text); }

    .search-exec-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .search-exec-btn:disabled { opacity: 0.6; cursor: wait; }

    .ext-search-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .ext-mini-btn {
      flex: 1;
      text-align: center;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 7px 4px;
      border-radius: 8px;
      text-decoration: none;
    }
    .ext-google { background: #e8f0fe; color: #1967d2; }
    .ext-tabelog { background: #fff3e0; color: #c76200; }

    /* タブ切り替え */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 2px 10px;
      font-size: 0.82rem;
      color: var(--muted);
      gap: 8px;
      flex-wrap: wrap;
    }
    .reset-link {
      background: none;
      border: none;
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.76rem;
      cursor: pointer;
      padding: 4px 0;
    }

    .shop-list { display: flex; flex-direction: column; gap: 14px; }

    .shop-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
    }
    .shop-card.has-memo { border-left: 4px solid var(--accent); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .shop-name { margin: 0; font-size: 1.05rem; font-weight: 700; }

    .fav-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      padding: 2px 4px;
      cursor: pointer;
      color: #cfc9c0;
    }
    .fav-btn.active { color: var(--star-active); }

    .save-api-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .save-api-btn.saved {
      background: #fdf3dc;
      border-color: #e8c468;
      color: #9c6b08;
    }

    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .catch-text {
      font-size: 0.82rem;
      color: var(--accent-dark);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }
    .pay-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .pay-card { background: var(--card-ok-bg); color: var(--card-ok-text); }
    .pay-paypay { background: var(--paypay-bg); color: var(--paypay-text); }
    .pay-cash { background: var(--cash-only-bg); color: var(--cash-only-text); }
    .pay-unknown { background: #eee; color: #555; }

    .genre-badge {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
    }
    .budget-badge { font-weight: 700; font-size: 0.83rem; }

    .photo-wrap { margin-bottom: 10px; }
    .menu-photo {
      width: 100%;
      max-height: 210px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: block;
    }

    .menu-box {
      background: #f9f8f6;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 0.84rem;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .memo-box {
      background: var(--memo-bg);
      border: 1px solid var(--memo-border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 0.84rem;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .box-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 3px;
      display: block;
    }
    .memo-box .box-label { color: var(--accent-dark); }

    .source-links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .src-link {
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }
    .src-google { background: #e8f0fe; color: #1967d2; }
    .src-hotpepper { background: #fce8e6; color: #c5221f; }
    .src-tabelog { background: #fff3e0; color: #c76200; }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px solid #f0ede7;
      padding-top: 10px;
    }
    .btn-sub {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.81rem;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      background: var(--surface);
      border-radius: 14px;
      border: 1px dashed var(--border);
      font-size: 0.86rem;
    }

    .credit {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 28px;
    }
    .credit a { color: var(--muted); }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { margin: 0 0 14px; font-size: 1.05rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .preview-img {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }
    .photo-remove-btn {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #b84225;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>10min LUNCH</h1>
    <button class="add-btn" id="openAddModalBtn">＋ お店を手動登録</button>
  </div>
</header>

<main>
  <section class="panel">
    <div class="row">
      <div class="field" style="flex: 1.6;">
        <label for="locationInput">エリア・駅名（または現在地）</label>
        <div class="inline-wrap">
          <input type="text" id="locationInput" placeholder="例：天神、博多、百道など" />
          <button type="button" class="sub-pill-btn" id="gpsBtn">📍 現在地</button>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>ジャンル</label>
        <div class="chips" id="genreChips">
          <button class="chip active" data-value="すべて">すべて</button>
          <button class="chip" data-value="和食">和食</button>
          <button class="chip" data-value="洋食">洋食</button>
          <button class="chip" data-value="定食">定食</button>
          <button class="chip" data-value="お弁当">お弁当</button>
          <button class="chip" data-value="カフェ">カフェ</button>
        </div>
      </div>
    </div>

    <div class="row" style="margin-bottom: 0;">
      <div class="field">
        <label for="budgetSelect">予算（マイリスト用）</label>
        <select id="budgetSelect">
          <option value="1500" selected>1,500円以内</option>
          <option value="1200">1,200円以内</option>
          <option value="1000">1,000円以内</option>
          <option value="9999">上限なし</option>
        </select>
      </div>
      <div class="field">
        <label for="paymentSelect">支払い方法</label>
        <select id="paymentSelect">
          <option value="all">すべて</option>
          <option value="card">💳 カード可</option>
          <option value="paypay">📱 PayPay可</option>
          <option value="cash">💴 現金のみ</option>
        </select>
      </div>
    </div>

    <button type="button" class="search-exec-btn" id="searchApiBtn">
      🔍 お店を検索する
    </button>

    <div class="ext-search-row">
      <a class="ext-mini-btn ext-google" id="extGoogleLink" href="#" target="_blank" rel="noopener">🗺️ Googleマップで直接探す</a>
      <a class="ext-mini-btn ext-tabelog" id="extTabelogLink" href="#" target="_blank" rel="noopener">⭐ 食べログで直接探す</a>
    </div>
  </section>

  <!-- タブ切り替え -->
  <div class="tabs">
    <button class="tab-btn active" id="tabSearchBtn">🔍 検索結果 (<span id="searchCountBadge">0</span>)</button>
    <button class="tab-btn" id="tabMyListBtn">★ マイリスト (<span id="myListCountBadge">0</span>)</button>
  </div>

  <!-- 検索結果エリア -->
  <div id="searchTabPanel">
    <div class="summary-bar">
      <span id="apiStatusText">エリアを入力するか「📍現在地」を押して検索してください</span>
    </div>
    <section class="shop-list" id="apiShopList">
      <div class="empty">上の「🔍 お店を検索する」ボタンを押すと、<br>周辺の実在するランチ店が写真付きで表示されます！</div>
    </section>
  </div>

  <!-- マイリストエリア -->
  <div id="myListTabPanel" style="display: none;">
    <div class="summary-bar">
      <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
        <input type="checkbox" id="onlyFavCheckbox" /> ★ お気に入りのみ表示
      </label>
      <div>
        <button class="reset-link" id="exportBtn" style="margin-right: 10px;">バックアップ保存</button>
        <button class="reset-link" id="resetDataBtn">初期化</button>
      </div>
    </div>
    <section class="shop-list" id="myShopList"></section>
  </div>

  <div class="credit">
    Powered by <a href="http://webservice.recruit.co.jp/" target="_blank" rel="noopener">ホットペッパーグルメ Webサービス</a>
  </div>
</main>

<!-- 編集モーダル -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <h2 id="editModalTitle">お店情報を編集</h2>
    <input type="hidden" id="editShopId" />
    <div class="field" style="margin-bottom: 10px;">
      <label for="editPayment">実際の支払い方法</label>
      <select id="editPayment">
        <option value="card_paypay">💳 カード / 📱 PayPay可</option>
        <option value="card">💳 カード可</option>
        <option value="paypay">📱 PayPay可</option>
        <option value="cash">💴 現金のみ</option>
        <option value="unknown">❓ 未確認</option>
      </select>
    </div>
    <div class="field" style="margin-bottom: 10px;">
      <label for="editMenu">メニュー一覧</label>
      <textarea id="editMenu" rows="3" placeholder="例：&#10;・塩サバ定食 980円&#10;・日替わりランチ 880円"></textarea>
    </div>
    <div class="field" style="margin-bottom: 10px;">
      <label for="editPhotoInput">メニュー・お店の写真</label>
      <input type="file" id="editPhotoInput" accept="image/*" />
      <div id="editPhotoPreviewWrap"></div>
    </div>
    <div class="field" style="margin-bottom: 10px;">
      <label for="editMemo">一言メモ</label>
      <textarea id="editMemo" rows="3" placeholder="例：12時台は混む、カウンター席あり"></textarea>
    </div>
    <div class="field" style="margin-bottom: 10px;">
      <label for="editGoogleUrl">Googleマップ URL（任意）</label>
      <input type="url" id="editGoogleUrl" placeholder="https://maps.app.goo.gl/..." />
    </div>
    <div class="field">
      <label for="editSourceUrl">ホットペッパー / 食べログ URL（任意）</label>
      <input type="url" id="editSourceUrl" placeholder="https://..." />
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-sub" id="closeEditModalBtn">キャンセル</button>
      <button type="button" class="btn-primary" id="saveEditBtn">保存する</button>
    </div>
  </div>
</div>

<!-- 新規手動登録モーダル -->
<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <h2>自分のお店を手動登録</h2>
    <div class="field" style="margin-bottom: 10px;">
      <label for="newName">お店の名前 *</label>
      <input type="text" id="newName" placeholder="例：〇〇弁当、街の定食屋" />
    </div>
    <div class="row" style="margin-bottom: 10px;">
      <div class="field">
        <label for="newGenre">ジャンル</label>
        <select id="newGenre">
          <option value="定食">定食</option>
          <option value="お弁当">お弁当</option>
          <option value="和食">和食</option>
          <option value="洋食">洋食</option>
          <option value="カフェ">カフェ</option>
        </select>
      </div>
      <div class="field">
        <label for="newBudget">予算目安（円）</label>
        <input type="number" id="newBudget" value="1000" step="50" />
      </div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
      <div class="field">
        <label for="newWalk">アクセス・徒歩メモ</label>
        <input type="text" id="newWalk" placeholder="例：徒歩5分" value="徒歩5分" />
      </div>
      <div class="field">
        <label for="newPayment">支払い方法</label>
        <select id="newPayment">
          <option value="card_paypay">💳 カード / 📱 PayPay可</option>
          <option value="card">💳 カード可</option>
          <option value="paypay">📱 PayPay可</option>
          <option value="cash">💴 現金のみ</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-bottom: 10px;">
      <label for="newMenu">メニュー一覧</label>
      <textarea id="newMenu" rows="3" placeholder="例：&#10;・唐揚げ弁当 700円"></textarea>
    </div>
    <div class="field" style="margin-bottom: 10px;">
      <label for="newPhotoInput">メニュー・お店の写真</label>
      <input type="file" id="newPhotoInput" accept="image/*" />
      <div id="newPhotoPreviewWrap"></div>
    </div>
    <div class="field" style="margin-bottom: 10px;">
      <label for="newMemo">一言メモ</label>
      <textarea id="newMemo" rows="2" placeholder="例：焼き魚が美味しい"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-sub" id="closeAddModalBtn">キャンセル</button>
      <button type="button" class="btn-primary" id="saveAddBtn">登録する</button>
    </div>
  </div>
</div>

<script>
  //https://script.google.com/macros/s/AKfycbzaQAy6otZc7cH0dVPL3ExBb0kI00C_s6eNdo0Eu3XTPZTkU2verF16tEmbUV74z3uH/exec
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzaQAy6otZc7cH0dVPL3ExBb0kI00C_s6eNdo0Eu3XTPZTkU2verF16tEmbUV74z3uH/exec";

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  const STORAGE_KEY = "lunch_pwa_shops_v2";
  let myShops = loadMyShops();
  let apiShops = [];
  let selectedGenre = "すべて";
  let gpsCoords = null;
  let tempEditPhoto = "";
  let tempNewPhoto = "";

  function loadMyShops() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try { return JSON.parse(saved); } catch (e) {}
    }
    return [];
  }

  function saveMyShops() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(myShops));
    } catch (e) {
      alert("保存容量がいっぱいです。不要な写真を削除するかバックアップ保存してください。");
    }
    document.getElementById("myListCountBadge").textContent = myShops.length;
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 600;
        const scale = img.width > maxW ? maxW / img.width : 1;
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderPaymentBadges(payment) {
    if (payment === "card_paypay") {
      return `<span class="pay-badge pay-card">💳 カード可</span><span class="pay-badge pay-paypay">📱 PayPay可</span>`;
    }
    if (payment === "card") return `<span class="pay-badge pay-card">💳 カード可</span>`;
    if (payment === "paypay") return `<span class="pay-badge pay-paypay">📱 PayPay可</span>`;
    if (payment === "cash") return `<span class="pay-badge pay-cash">💴 現金のみ</span>`;
    return `<span class="pay-badge pay-unknown">❓ 支払い未確認</span>`;
  }

  // 外部直接検索リンクの更新
  function updateExtLinks() {
    const loc = document.getElementById("locationInput").value.trim();
    const genreWord = selectedGenre === "すべて" ? "ランチ" : `${selectedGenre} ランチ`;
    const base = [loc || "現在地", genreWord].join(" ");
    if (gpsCoords && !loc) {
      document.getElementById("extGoogleLink").href =
        `https://www.google.com/maps/search/${encodeURIComponent(genreWord)}/@${gpsCoords.lat},${gpsCoords.lng},15z`;
    } else {
      document.getElementById("extGoogleLink").href =
        `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(base)}`;
    }
    document.getElementById("extTabelogLink").href =
      `https://www.google.com/search?q=${encodeURIComponent("site:tabelog.com " + base)}`;
  }

  // ホットペッパーAPI検索（GAS経由）
  async function searchHotPepper() {
    if (!GAS_URL || GAS_URL.includes("ここにウェブアプリのURL")) {
      alert("コード内の GAS_URL に、Google Apps ScriptのウェブアプリURLを貼り付けてください！");
      return;
    }

    const loc = document.getElementById("locationInput").value.trim();
    const pay = document.getElementById("paymentSelect").value;
    if (!loc && !gpsCoords) {
      alert("エリア名（例：天神、博多など）を入力するか、「📍 現在地」ボタンを押してください。");
      return;
    }

    const btn = document.getElementById("searchApiBtn");
    btn.disabled = true;
    btn.textContent = "🔍 検索中…";
    document.getElementById("apiStatusText").textContent = "お店データを取得しています…";

    const params = new URLSearchParams();
    params.set("lunch", "1");
    if (gpsCoords && !loc) {
      params.set("lat", gpsCoords.lat);
      params.set("lng", gpsCoords.lng);
    }
    const kwParts = [];
    if (loc) kwParts.push(loc);
    if (selectedGenre !== "すべて") kwParts.push(selectedGenre);
    if (kwParts.length > 0) params.set("keyword", kwParts.join(" "));
    if (pay === "card") params.set("card", "1");

    try {
      const res = await fetch(`${GAS_URL}?${params.toString()}`);
      const data = await res.json();
      apiShops = (data.results && data.results.shop) ? data.results.shop : [];
      document.getElementById("searchCountBadge").textContent = apiShops.length;
      document.getElementById("apiStatusText").textContent =
        `${apiShops.length}件のお店が見つかりました`;
      switchTab("search");
      renderApiShops();
    } catch (err) {
      document.getElementById("apiStatusText").textContent = "検索に失敗しました。";
      alert("お店データの取得に失敗しました。GASのURLや「全員がアクセス可能」設定を確認してください。");
    } finally {
      btn.disabled = false;
      btn.textContent = "🔍 お店を検索する";
    }
  }

  function renderApiShops() {
    const listEl = document.getElementById("apiShopList");
    if (apiShops.length === 0) {
      listEl.innerHTML = `<div class="empty">条件に合うお店が見つかりませんでした。<br>ジャンルを「すべて」にするか、エリア名を変えてお試しください。</div>`;
      return;
    }

    listEl.innerHTML = apiShops.map((shop, idx) => {
      const isSaved = myShops.some(m => m.id === "hp_" + shop.id);
      const photoUrl = (shop.photo && shop.photo.pc && shop.photo.pc.l) || "";
      const cardOk = shop.card === "利用可";
      const budgetStr = (shop.budget && (shop.budget.average || shop.budget.name)) || "予算情報なし";
      const genreStr = (shop.genre && shop.genre.name) || "グルメ";
      const hpUrl = (shop.urls && shop.urls.pc) || "#";
      const googleHref = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.name + " " + (shop.address || ""))}`;
      const tabelogHref = `https://www.google.com/search?q=${encodeURIComponent(shop.name + " 食べログ")}`;

      return `
        <article class="shop-card">
          <div class="card-top">
            <h3 class="shop-name">${escapeHtml(shop.name)}</h3>
            <button class="save-api-btn ${isSaved ? "saved" : ""}" onclick="saveFromApi(${idx})">
              ${isSaved ? "★ 保存済" : "☆ マイリストに保存"}
            </button>
          </div>
          ${shop.catch ? `<div class="catch-text">${escapeHtml(shop.catch)}</div>` : ""}
          <div class="meta-row">
            <span>🚶 ${escapeHtml(shop.mobile_access || shop.access || "")}</span>
            <span>🕒 ${escapeHtml(shop.open || "")}</span>
          </div>
          <div class="badges">
            <span class="pay-badge ${cardOk ? "pay-card" : "pay-unknown"}">${cardOk ? "💳 カード可" : "❓ カード要確認"}</span>
            <span class="genre-badge">${escapeHtml(genreStr)}</span>
            <span class="budget-badge">${escapeHtml(budgetStr)}</span>
          </div>
          ${photoUrl ? `<div class="photo-wrap"><img class="menu-photo" src="${photoUrl}" alt="${escapeHtml(shop.name)}" loading="lazy" /></div>` : ""}
          <div class="source-links">
            <a class="src-link src-hotpepper" href="${hpUrl}" target="_blank" rel="noopener">🍽️ ホットペッパー</a>
            <a class="src-link src-google" href="${googleHref}" target="_blank" rel="noopener">🗺️ Googleマップ</a>
            <a class="src-link src-tabelog" href="${tabelogHref}" target="_blank" rel="noopener">⭐ 食べログ</a>
          </div>
        </article>
      `;
    }).join("");
  }

  // 検索結果からマイリストへ保存
  window.saveFromApi = function(idx) {
    const shop = apiShops[idx];
    if (!shop) return;
    const id = "hp_" + shop.id;
    const exists = myShops.findIndex(m => m.id === id);
    if (exists >= 0) {
      if (confirm("マイリストから削除しますか？")) {
        myShops.splice(exists, 1);
        saveMyShops();
        renderApiShops();
        renderMyShops();
      }
      return;
    }
    myShops.unshift({
      id,
      name: shop.name,
      genre: (shop.genre && shop.genre.name) || "ランチ",
      budget: 1200,
      walkText: shop.mobile_access || shop.access || "",
      openText: shop.open || "",
      payment: shop.card === "利用可" ? "card" : "unknown",
      favorite: true,
      menu: "",
      photo: (shop.photo && shop.photo.pc && shop.photo.pc.l) || "",
      memo: shop.catch || "",
      googleUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.name + " " + (shop.address || ""))}`,
      sourceUrl: (shop.urls && shop.urls.pc) || ""
    });
    saveMyShops();
    renderApiShops();
    renderMyShops();
  };

  function renderMyShops() {
    document.getElementById("myListCountBadge").textContent = myShops.length;
    const maxBudget = Number(document.getElementById("budgetSelect").value);
    const payFilter = document.getElementById("paymentSelect").value;
    const onlyFav = document.getElementById("onlyFavCheckbox").checked;

    const filtered = myShops.filter(s => {
      if (onlyFav && !s.favorite) return false;
      if (s.budget && s.budget > maxBudget) return false;
      if (payFilter === "card" && !(s.payment === "card" || s.payment === "card_paypay")) return false;
      if (payFilter === "paypay" && !(s.payment === "paypay" || s.payment === "card_paypay")) return false;
      if (payFilter === "cash" && s.payment !== "cash") return false;
      return true;
    });

    const listEl = document.getElementById("myShopList");
    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty">マイリストに該当するお店がありません。<br>検索結果から「☆ マイリストに保存」するか、右上の「＋ お店を手動登録」で追加できます。</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(shop => {
      const googleHref = shop.googleUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.name)}`;
      const hpHref = (shop.sourceUrl && shop.sourceUrl.includes("hotpepper"))
        ? shop.sourceUrl
        : `https://www.google.com/search?q=${encodeURIComponent(shop.name + " ホットペッパー")}`;
      const tabelogHref = (shop.sourceUrl && shop.sourceUrl.includes("tabelog"))
        ? shop.sourceUrl
        : `https://www.google.com/search?q=${encodeURIComponent(shop.name + " 食べログ")}`;

      return `
        <article class="shop-card ${shop.memo ? "has-memo" : ""}">
          <div class="card-top">
            <h3 class="shop-name">${escapeHtml(shop.name)}</h3>
            <button class="fav-btn ${shop.favorite ? "active" : ""}" onclick="toggleFav('${shop.id}')">
              ${shop.favorite ? "★" : "☆"}
            </button>
          </div>
          <div class="meta-row">
            ${shop.walkText ? `<span>🚶 ${escapeHtml(shop.walkText)}</span>` : (shop.walkMin ? `<span>🚶 徒歩${shop.walkMin}分</span>` : "")}
            ${shop.openText ? `<span>🕒 ${escapeHtml(shop.openText)}</span>` : ""}
          </div>
          <div class="badges">
            ${renderPaymentBadges(shop.payment)}
            <span class="genre-badge">${escapeHtml(shop.genre)}</span>
            ${shop.budget ? `<span class="budget-badge">〜${Number(shop.budget).toLocaleString()}円</span>` : ""}
          </div>
          ${shop.photo ? `<div class="photo-wrap"><img class="menu-photo" src="${shop.photo}" alt="${escapeHtml(shop.name)}" /></div>` : ""}
          ${shop.menu ? `<div class="menu-box"><span class="box-label">📋 メニュー</span>${escapeHtml(shop.menu)}</div>` : ""}
          ${shop.memo ? `<div class="memo-box"><span class="box-label">📝 マイメモ</span>${escapeHtml(shop.memo)}</div>` : ""}
          <div class="source-links">
            <a class="src-link src-google" href="${googleHref}" target="_blank" rel="noopener">🗺️ Googleマップ</a>
            <a class="src-link src-hotpepper" href="${hpHref}" target="_blank" rel="noopener">🍽️ ホットペッパー</a>
            <a class="src-link src-tabelog" href="${tabelogHref}" target="_blank" rel="noopener">⭐ 食べログ</a>
          </div>
          <div class="card-actions">
            <button class="btn-sub" onclick="openEditModal('${shop.id}')">✏️ メニュー・写真・メモを編集</button>
          </div>
        </article>
      `;
    }).join("");
  }

  function switchTab(tab) {
    const isSearch = tab === "search";
    document.getElementById("tabSearchBtn").classList.toggle("active", isSearch);
    document.getElementById("tabMyListBtn").classList.toggle("active", !isSearch);
    document.getElementById("searchTabPanel").style.display = isSearch ? "block" : "none";
    document.getElementById("myListTabPanel").style.display = isSearch ? "none" : "block";
  }

  document.getElementById("tabSearchBtn").addEventListener("click", () => switchTab("search"));
  document.getElementById("tabMyListBtn").addEventListener("click", () => switchTab("mylist"));
  document.getElementById("searchApiBtn").addEventListener("click", searchHotPepper);

  // GPSボタン
  const gpsBtn = document.getElementById("gpsBtn");
  gpsBtn.addEventListener("click", () => {
    if (!navigator.geolocation) return alert("位置情報に対応していません。");
    gpsBtn.textContent = "取得中…";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        gpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        document.getElementById("locationInput").value = "";
        gpsBtn.textContent = "📍 取得済";
        gpsBtn.classList.add("gps-active");
        updateExtLinks();
      },
      () => {
        gpsBtn.textContent = "📍 現在地";
        alert("現在地を取得できませんでした。位置情報の許可を確認してください。");
      },
      { enableHighAccuracy: false, timeout: 8000 }
    );
  });

  document.getElementById("locationInput").addEventListener("input", () => {
    if (document.getElementById("locationInput").value.trim()) {
      gpsCoords = null;
      gpsBtn.textContent = "📍 現在地";
      gpsBtn.classList.remove("gps-active");
    }
    updateExtLinks();
  });

  document.getElementById("genreChips").addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    document.querySelectorAll("#genreChips .chip").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    selectedGenre = btn.dataset.value;
    updateExtLinks();
  });

  ["budgetSelect", "paymentSelect", "onlyFavCheckbox"].forEach(id => {
    document.getElementById(id).addEventListener("change", renderMyShops);
  });

  window.toggleFav = function(shopId) {
    const shop = myShops.find(s => s.id === shopId);
    if (!shop) return;
    shop.favorite = !shop.favorite;
    saveMyShops();
    renderMyShops();
  };

  // 編集モーダル
  const editModal = document.getElementById("editModal");
  function renderEditPhotoPreview() {
    const wrap = document.getElementById("editPhotoPreviewWrap");
    if (!tempEditPhoto) { wrap.innerHTML = ""; return; }
    wrap.innerHTML = `<img class="preview-img" src="${tempEditPhoto}" /><button type="button" class="photo-remove-btn" id="removeEditPhotoBtn">この写真を削除</button>`;
    document.getElementById("removeEditPhotoBtn").addEventListener("click", () => {
      tempEditPhoto = "";
      document.getElementById("editPhotoInput").value = "";
      renderEditPhotoPreview();
    });
  }

  window.openEditModal = function(shopId) {
    const shop = myShops.find(s => s.id === shopId);
    if (!shop) return;
    document.getElementById("editShopId").value = shop.id;
    document.getElementById("editModalTitle").textContent = `${shop.name} の編集`;
    document.getElementById("editPayment").value = shop.payment || "unknown";
    document.getElementById("editMenu").value = shop.menu || "";
    document.getElementById("editMemo").value = shop.memo || "";
    document.getElementById("editGoogleUrl").value = shop.googleUrl || "";
    document.getElementById("editSourceUrl").value = shop.sourceUrl || "";
    document.getElementById("editPhotoInput").value = "";
    tempEditPhoto = shop.photo || "";
    renderEditPhotoPreview();
    editModal.classList.add("open");
  };

  document.getElementById("editPhotoInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    compressImage(file, (dataUrl) => { tempEditPhoto = dataUrl; renderEditPhotoPreview(); });
  });

  document.getElementById("closeEditModalBtn").addEventListener("click", () => editModal.classList.remove("open"));
  document.getElementById("saveEditBtn").addEventListener("click", () => {
    const shop = myShops.find(s => s.id === document.getElementById("editShopId").value);
    if (shop) {
      shop.payment = document.getElementById("editPayment").value;
      shop.menu = document.getElementById("editMenu").value.trim();
      shop.memo = document.getElementById("editMemo").value.trim();
      shop.photo = tempEditPhoto;
      shop.googleUrl = document.getElementById("editGoogleUrl").value.trim();
      shop.sourceUrl = document.getElementById("editSourceUrl").value.trim();
      saveMyShops();
      renderMyShops();
    }
    editModal.classList.remove("open");
  });

  // 手動登録モーダル
  const addModal = document.getElementById("addModal");
  function renderNewPhotoPreview() {
    const wrap = document.getElementById("newPhotoPreviewWrap");
    if (!tempNewPhoto) { wrap.innerHTML = ""; return; }
    wrap.innerHTML = `<img class="preview-img" src="${tempNewPhoto}" /><button type="button" class="photo-remove-btn" id="removeNewPhotoBtn">この写真を削除</button>`;
    document.getElementById("removeNewPhotoBtn").addEventListener("click", () => {
      tempNewPhoto = "";
      document.getElementById("newPhotoInput").value = "";
      renderNewPhotoPreview();
    });
  }

  document.getElementById("newPhotoInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    compressImage(file, (dataUrl) => { tempNewPhoto = dataUrl; renderNewPhotoPreview(); });
  });

  document.getElementById("openAddModalBtn").addEventListener("click", () => {
    tempNewPhoto = "";
    document.getElementById("newPhotoInput").value = "";
    renderNewPhotoPreview();
    addModal.classList.add("open");
  });
  document.getElementById("closeAddModalBtn").addEventListener("click", () => addModal.classList.remove("open"));
  document.getElementById("saveAddBtn").addEventListener("click", () => {
    const name = document.getElementById("newName").value.trim();
    if (!name) return alert("お店の名前を入力してください。");
    myShops.unshift({
      id: "custom_" + Date.now(),
      name,
      genre: document.getElementById("newGenre").value,
      budget: Number(document.getElementById("newBudget").value) || 1000,
      walkText: document.getElementById("newWalk").value.trim(),
      openText: "",
      payment: document.getElementById("newPayment").value,
      favorite: true,
      menu: document.getElementById("newMenu").value.trim(),
      photo: tempNewPhoto,
      memo: document.getElementById("newMemo").value.trim(),
      googleUrl: "",
      sourceUrl: ""
    });
    saveMyShops();
    renderMyShops();
    switchTab("mylist");
    document.getElementById("newName").value = "";
    document.getElementById("newMenu").value = "";
    document.getElementById("newMemo").value = "";
    addModal.classList.remove("open");
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(myShops, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "lunch_memo_backup.json";
    a.click();
  });

  document.getElementById("resetDataBtn").addEventListener("click", () => {
    if (confirm("マイリストのデータをすべて消去しますか？")) {
      localStorage.removeItem(STORAGE_KEY);
      myShops = [];
      renderMyShops();
      renderApiShops();
    }
  });

  updateExtLinks();
  renderMyShops();
</script>
</body>
</html>
